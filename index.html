<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Video Tags</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- LOGIN -->
  <div id="screen-login">
    <div class="login-card">
      <div class="login-logo">⚽</div>
      <h1>Video Tags</h1>
      <p class="login-subtitle">Vereinsinterne Analyse-Datenbank</p>
      <form id="form-login">
        <div class="form-group">
          <label for="input-email">E-Mail</label>
          <input type="email" id="input-email" placeholder="trainer@verein.de" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="input-password">Passwort</label>
          <input type="password" id="input-password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary btn-full" id="btn-login">Anmelden</button>
        <p id="login-error" class="error-msg hidden"></p>
      </form>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="screen-app" class="hidden">

    <nav id="main-nav">
      <div class="nav-brand">⚽ Video Tags</div>
      <div class="nav-links">
        <button class="nav-btn active" data-view="games">Spiele</button>
        <button class="nav-btn" data-view="query">Suche</button>
        <button class="nav-btn" data-view="tags">Tags verwalten</button>
      </div>
      <div class="nav-user">
        <span id="nav-user-email"></span>
        <button id="btn-logout" class="btn-ghost">Abmelden</button>
      </div>
    </nav>

    <main id="main-content">

      <!-- SPIELE -->
      <div id="view-games" class="view">
        <div class="card">
          <h2>Neues Spiel anlegen</h2>
          <form id="form-new-game">
            <div class="form-row">
              <div class="form-group">
                <label for="game-date">Datum</label>
                <input type="date" id="game-date" required>
              </div>
              <div class="form-group">
                <label>Saison</label>
                <div class="season-display" id="game-season-display">—</div>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="game-team">Mannschaft</label>
                <select id="game-team" required>
                  <option value="">Mannschaft wählen...</option>
                </select>
              </div>
              <div class="form-group">
                <label for="game-home-away">Heim / Auswärts <span class="label-hint">(optional)</span></label>
                <select id="game-home-away">
                  <option value="">—</option>
                  <option value="Heim">Heim</option>
                  <option value="Auswärts">Auswärts</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="game-opponent">Gegner</label>
                <input type="text" id="game-opponent" required maxlength="80">
              </div>
              <div class="form-group">
                <label for="game-result">Ergebnis <span class="label-hint">(optional)</span></label>
                <input type="text" id="game-result" maxlength="20">
              </div>
            </div>
            <div class="form-group">
              <label for="game-video-link">Link zum Video <span class="label-hint">(optional)</span></label>
              <input type="text" id="game-video-link" placeholder="https://..." maxlength="500">
            </div>
            <div class="form-actions">
              <button type="submit" class="btn-primary" id="btn-save-game">Spiel anlegen</button>
            </div>
            <div id="game-feedback" class="feedback hidden"></div>
          </form>
        </div>

        <div id="games-list">
          <p class="loading-hint">Spiele werden geladen...</p>
        </div>
      </div>

      <!-- SUCHE -->
      <div id="view-query" class="view hidden">
        <div class="card">
          <h2>Szenen suchen</h2>
          <div class="filter-grid">
            <div class="form-group">
              <label for="filter-season">Saison</label>
              <select id="filter-season">
                <option value="">Alle Saisons</option>
              </select>
            </div>
            <div class="form-group">
              <label for="filter-team">Mannschaft</label>
              <select id="filter-team">
                <option value="">Alle Mannschaften</option>
              </select>
            </div>
            <div class="form-group">
              <label for="filter-date-from">Datum von</label>
              <input type="date" id="filter-date-from">
            </div>
            <div class="form-group">
              <label for="filter-date-to">Datum bis</label>
              <input type="date" id="filter-date-to">
            </div>
          </div>
          <div class="form-group">
            <label for="filter-opponent">Gegner</label>
            <input type="text" id="filter-opponent" placeholder="Vereinsname...">
          </div>
          <div class="form-group">
            <label>Tags <span class="label-hint">(mind. einer der gewählten Tags muss vorhanden sein)</span></label>
            <div id="query-tag-selector" class="tag-selector"></div>
          </div>
          <div class="form-actions">
            <button class="btn-primary" id="btn-search">Suchen</button>
            <button class="btn-secondary" id="btn-reset-filter">Filter zurücksetzen</button>
          </div>
        </div>
        <div id="query-results">
          <p class="results-hint">Filter anwenden um Szenen anzuzeigen.</p>
        </div>
      </div>

      <!-- TAGS VERWALTEN -->
      <div id="view-tags" class="view hidden">
        <div class="card">
          <h2>Tags verwalten</h2>
          <div class="add-tag-section">
            <h3>Neuen Tag erstellen</h3>
            <div class="add-tag-row">
              <div class="form-group flex-grow">
                <label for="new-tag-name">Name</label>
                <input type="text" id="new-tag-name" placeholder="Tag-Name..." maxlength="60">
              </div>
              <div class="form-group">
                <label for="new-tag-color">Farbe</label>
                <input type="color" id="new-tag-color" value="#6366F1">
              </div>
              <div class="form-group form-group-btn">
                <label>&nbsp;</label>
                <button class="btn-primary" id="btn-add-tag">Hinzufügen</button>
              </div>
            </div>
            <div id="add-tag-feedback" class="feedback hidden"></div>
          </div>
          <div id="tags-list" class="tags-list">
            <p class="loading-hint">Tags werden geladen...</p>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
